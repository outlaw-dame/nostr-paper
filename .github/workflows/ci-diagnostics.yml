name: CI Diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  diagnostics:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Regenerate, verify, and commit lockfile
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
          npm run lint -- --quiet --max-warnings=-1
          npm run security:audit:prod
          rm .github/workflows/ci-diagnostics.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/ci-diagnostics.yml
          git commit -m "security: lock patched production dependencies"
          git push origin HEAD:${{ github.head_ref }}
