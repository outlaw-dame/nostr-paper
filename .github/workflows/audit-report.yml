name: Dependency Resolver Report

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Capture resolver output
        run: npm install --package-lock-only --ignore-scripts > resolver.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-resolver-report
          path: resolver.log
          retention-days: 1
